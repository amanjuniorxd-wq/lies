name: Build GYAN VPN macOS DMG
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - run: npx electron-builder --mac dmg --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: GYAN-VPN-macOS
          path: dist/*.dmg
          retention-days: 30
